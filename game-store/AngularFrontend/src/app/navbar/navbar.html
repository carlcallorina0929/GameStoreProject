<nav class="navbar">
  <div class="navbar-container">

    <!-- Brand -->
    <div class="navbar-brand">
      <a routerLink="/home">Game <span class="accent">Den</span></a>
    </div>

    <!-- Mobile Toggle -->
    <button
      class="hamburger"
      (click)="toggleMenu()"
      [class.active]="menuOpen"
    >
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Links -->
    <ul class="nav-links" [class.open]="menuOpen">
     <li>
  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
  <span nz-icon nzType="home"></span>
  Home
</a>
</li>
      <li><a 
    routerLink="/library" 
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">

    <span nz-icon nzType="appstore"></span>
    Library
  </a></li>
      <li><a 
  routerLink="/cart"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
>
  <span nz-icon nzType="shopping-cart"></span>
  Cart
</a></li>

      <!-- Account Dropdown -->
      <li class="account-menu">

        <button class="nav-action" (click)="toggleAccountMenu()">
          <span nz-icon nzType="user" nzTheme="outline"></span>
          Account
          <svg [class.rotate]="accountMenuOpen" width="12" height="12"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>

        <div *ngIf="accountMenuOpen" class="dropdown animate-pop">
          <a href="/profile" (click)="goToProfileFromLink($event)">Profile</a>
          <a href="/transactions" (click)="goToTransactionsFromLink($event)">Transactions</a>
          <div class="divider"></div>
          <button (click)="openLogoutModal()">Logout</button>
        </div>
      </li>
    </ul>

  </div>
</nav>

<!-- Logout Confirmation Modal (placed at the bottom as requested) -->
<div
  class="auth-modal-backdrop"
  *ngIf="logoutModalOpen()"
  (click)="closeLogoutModal()"
>
  <div
    class="auth-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Logout confirmation"
    (click)="$event.stopPropagation()"
  >
    <span class="auth-kicker">Alert</span>
    <h3>Are you sure you want to logout?</h3>
    <p>You will be redirected to the login screen.</p>

    <div class="logout-modal-actions">
      <button
        type="button"
        class="logout-modal-btn logout-modal-yes"
        (click)="confirmLogout()"
      >
        YES
      </button>
      <button
        type="button"
        class="logout-modal-btn logout-modal-no"
        (click)="closeLogoutModal()"
      >
        NO
      </button>
    </div>
  </div>
</div>
