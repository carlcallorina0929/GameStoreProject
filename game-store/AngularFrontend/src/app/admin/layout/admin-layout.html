<nz-layout class="admin-layout-shell" [class.mobile-shell]="isMobile()">
  <div
    class="mobile-backdrop"
    *ngIf="isMobile() && mobileSidebarOpen()"
    (click)="closeMobileSidebar()"
  ></div>

  <nz-sider
    class="admin-sider"
    [class.mobile-open]="isMobile() && mobileSidebarOpen()"
    nzTheme="dark"
    [nzWidth]="260"
    [nzCollapsedWidth]="0"
    [nzTrigger]="null"
  >
    <div class="brand">Game Den Admin</div>
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/admin/dashboard" routerLinkActive="ant-menu-item-selected" (click)="closeMobileSidebar()">
        Dashboard
      </li>
      <li nz-menu-item routerLink="/admin/games" routerLinkActive="ant-menu-item-selected" (click)="closeMobileSidebar()">
        Games Management
      </li>
      <li nz-menu-item routerLink="/admin/users" routerLinkActive="ant-menu-item-selected" (click)="closeMobileSidebar()">
        Users Management
      </li>
      <li nz-menu-item routerLink="/admin/analytics" routerLinkActive="ant-menu-item-selected" (click)="closeMobileSidebar()">
        Analytics
      </li>
      <li nz-menu-item (click)="requestLogout()">Logout</li>
    </ul>
  </nz-sider>

  <nz-layout>
    <nz-header class="admin-header">
      <button *ngIf="isMobile()" nz-button nzType="default" (click)="toggleSidebar()">☰</button>
      <span class="header-title"></span>
    </nz-header>
    <nz-content class="admin-content">
      <router-outlet />
    </nz-content>
  </nz-layout>
</nz-layout>

<nz-modal
  [nzVisible]="logoutModalVisible()"
  [nzTitle]="'Confirm Logout'"
  [nzOkText]="'Logout'"
  [nzCancelText]="'Cancel'"
  [nzOkDanger]="true"
  (nzOnCancel)="cancelLogout()"
  (nzOnOk)="confirmLogout()"
>
  <ng-container *nzModalContent>
    <p>Are you sure you want to log out from the admin page?</p>
  </ng-container>
</nz-modal>
